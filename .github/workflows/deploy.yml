name: Build, Verify & Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: compro-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Typecheck, Static Build & Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Astro typecheck
        run: npm run check

      - name: Astro static build
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and verify Docker container (non-80/443 port)
        run: |
          docker build -t webramah-compro:ci .
          docker run -d --name webramah-ci-test -p 18090:8080 webramah-compro:ci
          trap 'docker rm -f webramah-ci-test >/dev/null 2>&1 || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:18090/ | grep -q "Web Ramah"
          curl -fsS http://127.0.0.1:18090/layanan/ | grep -q "Mulai Rp 1,8 Juta"
          curl -fsS http://127.0.0.1:18090/en/ | grep -q "Enterprise Trust"
          for img in about-studio.jpg enterprise-meeting.jpg showcase-compro.jpg showcase-landing.jpg showcase-mobile.jpg showcase-software.jpg showcase-store.jpg; do
            curl -fsSI "http://127.0.0.1:18090/images/${img}" >/dev/null
          done
          status_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/layanan)"
          echo "Non-trailing slash status=${status_code}"

  deploy:
    name: Deploy Docker Compose to VPS (Port 8090)
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH credentials
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
        run: |
          if [ -z "${VPS_IP:-}" ] || [ -z "${VPS_USERNAME:-}" ] || [ -z "${VPS_KEY:-}" ]; then
            echo "ERROR: Missing one of VPS_IP, VPS_USERNAME, or VPS_KEY repository secrets."
            exit 1
          fi
          VPS_HOST="$(printf '%s' "$VPS_IP" | tr -d '[:space:]')"
          VPS_USER="$(printf '%s' "$VPS_USERNAME" | tr -d '[:space:]')"
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "VPS_USER=$VPS_USER" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package and upload application to VPS
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.astro' \
            -czf /tmp/webramah-compro.tar.gz .
          scp -i ~/.ssh/vps_deploy_key -o BatchMode=yes \
            /tmp/webramah-compro.tar.gz \
            "${VPS_USER}@${VPS_HOST}:/tmp/webramah-compro.tar.gz"

      - name: Build and start container on VPS (external port 8090 -> internal 8080)
        run: |
          ssh -i ~/.ssh/vps_deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          APP_DIR="$HOME/apps/webramah-compro"
          LEGACY_LAMANKITA_DIR="$HOME/apps/lamankita-compro"
          LEGACY_KIRANA_DIR="$HOME/apps/kirana-compro"
          APP_PORT="${APP_PORT:-8090}"
          mkdir -p "$APP_DIR"

          if [ -f "$APP_DIR/.env" ]; then
            cp "$APP_DIR/.env" /tmp/webramah-compro.env.bak
          elif [ -f "$LEGACY_LAMANKITA_DIR/.env" ]; then
            cp "$LEGACY_LAMANKITA_DIR/.env" /tmp/webramah-compro.env.bak
          elif [ -f "$LEGACY_KIRANA_DIR/.env" ]; then
            cp "$LEGACY_KIRANA_DIR/.env" /tmp/webramah-compro.env.bak
          fi
          find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
          tar -xzf /tmp/webramah-compro.tar.gz -C "$APP_DIR"
          rm -f /tmp/webramah-compro.tar.gz
          if [ -f /tmp/webramah-compro.env.bak ]; then
            mv /tmp/webramah-compro.env.bak "$APP_DIR/.env"
          fi

          cd "$APP_DIR"
          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
            APP_PORT="${APP_PORT:-8090}"
          fi

          if docker info >/dev/null 2>&1; then
            DOCKER="docker"
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER="sudo -n docker"
          else
            echo "ERROR: Docker daemon is not accessible for user $(whoami)."
            exit 1
          fi

          # Clean up legacy containers from before rebrand so port 8090 stays free.
          $DOCKER rm -f kirana-compro lamankita-compro >/dev/null 2>&1 || true
          rm -rf "$LEGACY_KIRANA_DIR" "$LEGACY_LAMANKITA_DIR"

          if $DOCKER compose version >/dev/null 2>&1; then
            $DOCKER compose up -d --build --remove-orphans
          elif command -v docker-compose >/dev/null 2>&1; then
            if [ "$DOCKER" = "docker" ]; then
              docker-compose up -d --build --remove-orphans
            else
              sudo -n docker-compose up -d --build --remove-orphans
            fi
          else
            echo "ERROR: Docker Compose is not installed on the VPS."
            exit 1
          fi

          for i in $(seq 1 15); do
            if command -v curl >/dev/null 2>&1 && curl -fsS "http://127.0.0.1:${APP_PORT}/" >/dev/null 2>&1; then
              echo "Deployment succeeded on http://127.0.0.1:${APP_PORT}/ (container port 8080)"
              break
            elif command -v wget >/dev/null 2>&1 && wget -q -O /dev/null "http://127.0.0.1:${APP_PORT}/" >/dev/null 2>&1; then
              echo "Deployment succeeded on http://127.0.0.1:${APP_PORT}/ (container port 8080)"
              break
            elif $DOCKER exec webramah-compro wget -q -O /dev/null http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "Deployment container healthy on mapped port ${APP_PORT}:8080"
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "ERROR: Container failed health verification on port ${APP_PORT}"
              $DOCKER ps -a --filter "name=webramah-compro" || true
              $DOCKER logs --tail 50 webramah-compro || true
              exit 1
            fi
            sleep 2
          done

          $DOCKER image prune -f >/dev/null 2>&1 || true
          EOF

      - name: Cleanup temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/vps_deploy_key /tmp/webramah-compro.tar.gz

