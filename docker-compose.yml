services:
  compro:
    build:
      context: .
      dockerfile: Dockerfile
    image: halamankode-compro:latest
    container_name: halamankode-compro
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

